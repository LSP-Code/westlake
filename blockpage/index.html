<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #050505;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        /* 
           Continuous, fluid organic moving background.
           Using multiple layers rotating at different speeds to create a seamless dynamic aura.
        */
        .aura-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .aura-layer {
            position: absolute;
            top: -25%;
            left: -25%;
            width: 150%;
            height: 150%;
            background: radial-gradient(circle at 40% 40%, rgba(255, 255, 255, 0.07) 0%, rgba(255, 255, 255, 0.02) 30%, transparent 60%),
                        radial-gradient(circle at 70% 60%, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.01) 25%, transparent 55%);
            animation: drift1 25s linear infinite;
        }

        .aura-layer-2 {
            position: absolute;
            top: -25%;
            left: -25%;
            width: 150%;
            height: 150%;
            background: radial-gradient(circle at 60% 30%, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.02) 25%, transparent 50%);
            animation: drift2 18s linear infinite;
            mix-blend-mode: screen;
        }

        @keyframes drift1 {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
        }

        @keyframes drift2 {
            0% { transform: rotate(360deg) scale(1.1); }
            50% { transform: rotate(180deg) scale(0.95); }
            100% { transform: rotate(0deg) scale(1.1); }
        }

        /* Content Container with Entrance Animation */
        .container {
            max-width: 450px;
            padding: 40px 20px;
            z-index: 2;
            animation: fadeInScale 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInScale {
            0% {
                opacity: 0;
                transform: scale(0.95);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Static minimalist tracking logo text (no pulse/animation) */
        .brand {
            font-weight: 900;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 5px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 15px;
        }

        h1 {
            font-size: 2.6rem;
            font-weight: 800;
            margin: 0 0 15px 0;
            letter-spacing: -1px;
            background: linear-gradient(180deg, #ffffff 0%, #b3b3b3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Line stretches out on load, then keeps a gentle, flowing shimmer glow */
        .divider {
            width: 0px;
            height: 1px;
            background: linear-gradient(90deg, transparent 0%, #ffffff 50%, transparent 100%);
            margin: 0 auto 30px;
            animation: expandLine 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards,
                       lineGlow 3s ease-in-out infinite 1.7s;
        }

        @keyframes expandLine {
            to { width: 120px; }
        }

        @keyframes lineGlow {
            0%, 100% { opacity: 0.4; transform: scaleX(1); }
            50% { opacity: 1; transform: scaleX(1.1); }
        }

        p {
            font-size: 1.05rem;
            color: #999999;
            line-height: 1.65;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="aura-wrapper">
        <div class="aura-layer"></div>
        <div class="aura-layer-2"></div>
    </div>

    <div class="container">
        <div class="brand">Westlake Home</div>
        <h1>Access Denied</h1>
        <div class="divider"></div>
        <p>This website is currently restricted by your home administrator. Please contact your network manager if you believe this is an error.</p>
    </div>

</body>
</html>
