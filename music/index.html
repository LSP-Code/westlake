<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Westlake Radio Live Display</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #121212; color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .container { width: 100vw; height: 100vh; display: flex; align-items: center; padding: 0 8vw; gap: 4vw; background: #000; position: relative; }
        .blur-bg { position: absolute; width: 100%; height: 100%; object-fit: cover; filter: blur(80px) brightness(0.3); opacity: 0.6; }
        .art { width: 40vh; height: 40vh; border-radius: 2vh; box-shadow: 0 2vh 5vh rgba(0,0,0,0.7); z-index: 2; object-fit: cover; background: #222; }
        .info { z-index: 2; }
        .title { font-size: 7vh; font-weight: 800; margin-bottom: 1vh; line-height: 1.1; letter-spacing: -1px; }
        .artist { font-size: 3.5vh; color: rgba(255,255,255,0.6); font-weight: 500; }
        .wm { position: absolute; top: 6vh; right: 4vw; font-family: 'Oswald', sans-serif; font-size: 5vh; text-transform: uppercase; z-index: 2; letter-spacing: -1px; }
    </style>
</head>
<body>
    <div class="container">
        <img src="" class="blur-bg" id="bgArt">
        <div class="wm">WESTLAKE RADIO</div>
        <img src="" class="art" id="mainArt">
        <div class="info">
            <div class="title" id="title">Waiting for signal...</div>
            <div class="artist" id="artist"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const db = getFirestore(initializeApp({
            apiKey: "AIzaSyDQhL_WvZCnnuTpi5v_H5t9ByqJXhPmajM",
            projectId: "westlake-radio",
            appId: "1:191254873145:web:66f3689e7aee6805f439e8"
        }));

        const mainArt = document.getElementById('mainArt');
        const bgArt = document.getElementById('bgArt');

        onSnapshot(doc(db, "radio_status", "current_song"), async (snap) => {
            const data = snap.data();
            if (!data) return;

            document.getElementById('title').textContent = data.title;
            document.getElementById('artist').textContent = data.artist;

            // Forced URL to prevent cache
            const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(data.title + ' ' + data.artist)}&media=music&limit=1`);
            const json = await res.json();
            
            if (json.results?.length > 0) {
                const imgUrl = json.results[0].artworkUrl100.replace('100x100bb.jpg', '600x600bb.jpg');
                const uniqueUrl = imgUrl + '?v=' + Date.now();
                mainArt.src = uniqueUrl;
                bgArt.src = uniqueUrl;
            }
        });
    </script>
</body>
</html>
